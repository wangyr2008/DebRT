# DebRT：dnsmasq 承载全网 DNS，崩溃必须秒级拉起（事件机制，不靠 30 分钟 timer）
[Service]
Restart=on-failure
RestartSec=3
# 启动前预建上游 servers-file：/run 是 tmpfs，重启后该文件不存在，dnsmasq 会在启动
# 日志里报一条 "cannot read /run/dert-dns/upstream.conf"（2.91 实测非致命，但每次
# 开机一条错误，且 LAN DNS 在钩子写入前无上游）。只创建不覆盖已有内容；加 - 前缀，
# 任何失败都绝不阻塞 dnsmasq 启动（真机 2026-11-09 验证：删文件重启后日志无错误行，
# 钩子随后写入 2 条上游，解析正常）。
ExecStartPre=-/bin/sh -c 'mkdir -p /run/dert-dns; [ -e /run/dert-dns/upstream.conf ] || : > /run/dert-dns/upstream.conf'
