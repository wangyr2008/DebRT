# 由 SeedRou 安装/维护（install.sh 与收敛流程，见 COEXISTENCE.md）：
# sing-box 启动前等 WAN 就绪（防 auto_route 死循环）+ 崩溃时自动清理残留
[Unit]
After=network-online.target
Wants=network-online.target
OnFailure=seedrou-singbox-cleanup.service

[Service]
ExecStartPre=/usr/local/lib/seedrou/wait-wan
TimeoutStartSec=210
Restart=on-failure
RestartSec=3
