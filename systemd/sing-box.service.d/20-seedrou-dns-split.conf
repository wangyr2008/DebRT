# 由 SeedRou 安装/维护（install.sh 与收敛流程，见 COEXISTENCE.md §DNS 分流）：
#
#   ExecStartPre  dns-split-prepare   按当前 PD 前缀重新生成 00-seedrou-dns.json
#                                     （sing-box 只在启动时读配置，必须在启动前写）
#   ExecStartPost dns-split-sync      读 config.json 的 include_mac_address，
#                                     派生 nft 分流表 inet seedrou_dns
#   ExecStopPost  dns-split-teardown  任何方式停止时删表，DNS 回落 dnsmasq
#
# 为什么用 drop-in 而不是改官方 unit：sing-box 内核升级会重写
# /usr/lib/systemd/system/sing-box.service，drop-in 在 /etc 下不受影响。
#
# 前两个钩子不需要 root（以 User=sing-box 运行，只读写 /etc/sing-box）；
# nft 操作需要 root，所以 ExecStartPost / ExecStopPost 带 + 前缀。
[Service]
ExecStartPre=/usr/local/lib/seedrou/dns-split-prepare
ExecStartPost=+/usr/local/lib/seedrou/dns-split-sync
ExecStopPost=+/usr/local/lib/seedrou/dns-split-teardown
