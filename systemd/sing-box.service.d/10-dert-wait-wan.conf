# 由 DebRT 安装/维护（install.sh 与收敛流程，见 COEXISTENCE.md）：
# sing-box 启动前等 WAN 就绪（防 auto_route 死循环）+ 崩溃时自动清理残留
# 不依赖 network-online（wait-online 会等未插线的桥接口导致挂起）——
# WAN 就绪由 ExecStartPre wait-wan 精确等待
[Unit]
OnFailure=dert-singbox-cleanup.service

[Service]
ExecStartPre=/usr/local/lib/dert/wait-wan
TimeoutStartSec=210
Restart=on-failure
RestartSec=3
