# DebRT：限制 journal 的磁盘占用（v0.1.122）
#
# 真机实测：默认配置下 journal 长到 4.0 GB，而根分区只有 55 GB。
# 更要紧的是写放大——journald 每记一行，磁盘开销远大于文本本身
# （实测 120 秒写 0.89 MB 盘，同期只产生 0.01 MB 文本，约 89 倍）。
#
# 注意：这两个上限约束的是**保留量**，不减少写入量。要少写只能少记
# （降低日志级别/减少日志来源），或者干脆 Storage=volatile 全部放内存——
# 代价是重启后日志全丢，路由器排障会失去线索，所以这里不这么做。
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=50M
# 内核消息最多每 5 分钟 fsync 一次（默认值，写出来是为了明确语义：
# 小批量、非实时落盘，避免每行都触发一次刷盘）
SyncIntervalSec=5min
